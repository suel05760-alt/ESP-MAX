<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle ESP32</title>

    <!-- Biblioteca MQTT para o navegador -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top, #1e293b, #020617);

            color: white;
        }

        .container {
            width: 90%;
            max-width: 450px;

            background: rgba(15, 23, 42, 0.95);

            border: 1px solid #334155;

            padding: 35px;

            text-align: center;

                0 20px 50px rgba(0, 0, 0, 0.5);
        }

            font-size: 32px;
            margin-bottom: 8px;

        .subtitulo {

        }

            background: #334155;

        .conexao {

<body>

    <div class="container">

        <h1>ESP32</h1>

        <p class="subtitulo">
            Controle do LED GPIO 2
        </p>

        <!-- STATUS DO LED -->

        <div class="status-box">

            <div id="ledIndicador"
                 class="led-indicador desligado">
            </div>

            <p id="status">
                DESLIGADO
            </p>

        </div>

        <!-- STATUS MQTT -->

        <div id="conexao" class="conexao">
            ● Conectando ao HiveMQ...
        </div>

        <!-- BOTÕES -->

        <div class="botoes">

            <button
                id="btnLigar"
                class="btn-ligar"
                onclick="ligarLED()"
                disabled>
                LIGAR
            </button>

            <button
                id="btnDesligar"
                class="btn-desligar"
                onclick="desligarLED()"
                disabled>
                DESLIGAR
            </button>

        </div>

        <!-- INFORMAÇÕES -->

        <div class="info">

            <div>
                GPIO:
                <span>2</span>
            </div>

            <div>
                MQTT:
                <span>HiveMQ Cloud</span>
            </div>

            <div>
                Status:
                <span id="statusMQTT">Offline</span>
            </div>

        </div>

    </div>


<script>

// ======================================================
// CONFIGURAÇÃO HIVEMQ
// ======================================================

const MQTT_HOST =
    "wss://d7fd89e5e9b44d38b2a248bb67d9e159.s1.eu.hivemq.cloud:8884/mqtt";


// ======================================================
// COLOQUE SEU USUÁRIO E SENHA DO HIVEMQ AQUI
// ======================================================

const MQTT_USUARIO = "SEU_USUARIO";

const MQTT_SENHA = "SUA_SENHA";


// ======================================================
// TÓPICOS
// ======================================================

const TOPICO_COMANDO =
    "esp32/gpio2/comando";

const TOPICO_STATUS =
    "esp32/gpio2/status";


// ======================================================
// ELEMENTOS HTML
// ======================================================

const status = document.getElementById("status");

const ledIndicador =
    document.getElementById("ledIndicador");

const conexao =
    document.getElementById("conexao");

const statusMQTT =
    document.getElementById("statusMQTT");

const btnLigar =
    document.getElementById("btnLigar");

const btnDesligar =
    document.getElementById("btnDesligar");


// ======================================================
// CLIENTE MQTT
// ======================================================

const clientID =
    "SITE-ESP32-" +
    Math.random().toString(16).substring(2);


const client = mqtt.connect(MQTT_HOST, {

    clientId: clientID,

    username: MQTT_USUARIO,

    password: MQTT_SENHA,

    clean: true,

    connectTimeout: 10000,

    reconnectPeriod: 3000
});


// ======================================================
// CONECTADO
// ======================================================

client.on("connect", function () {

    console.log("Conectado ao HiveMQ!");

    conexao.innerHTML =
        "● Conectado ao HiveMQ";

    conexao.className =
        "conexao online";

    statusMQTT.innerText =
        "Online";

    btnLigar.disabled = false;

    btnDesligar.disabled = false;


    // Assina o tópico de status

    client.subscribe(
        TOPICO_STATUS,
        function (erro) {

            if (erro) {

                console.error(
                    "Erro ao assinar tópico:",
                    erro
                );

            } else {

                console.log(
                    "Inscrito em:",
                    TOPICO_STATUS
                );

            }

        }
    );

});


// ======================================================
// RECEBER MENSAGEM MQTT
// ======================================================

client.on("message", function (topic, mensagem) {

    console.log(
        "Mensagem recebida:",
        topic,
        mensagem.toString()
    );


    if (topic === TOPICO_STATUS) {

        const estado =
            mensagem.toString().toUpperCase();


        if (estado === "ON") {

            mostrarLED(true);

        }


        else if (estado === "OFF") {

            mostrarLED(false);

        }

    }

});


// ======================================================
// ERRO
// ======================================================

client.on("error", function (erro) {

    console.error(
        "Erro MQTT:",
        erro
    );

    conexao.innerHTML =
        "● Erro de conexão";

    conexao.className =
        "conexao erro";

    statusMQTT.innerText =
        "Erro";

});


// ======================================================
// DESCONECTADO
// ======================================================

client.on("offline", function () {

    conexao.innerHTML =
        "● HiveMQ offline";

    conexao.className =
        "conexao erro";

    statusMQTT.innerText =
        "Offline";

    btnLigar.disabled = true;

    btnDesligar.disabled = true;

});


// ======================================================
// LIGAR LED
// ======================================================

function ligarLED() {

    if (!client.connected) {
        return;
    }

    client.publish(
        TOPICO_COMANDO,
        "ON"
    );

    console.log(
        "Comando enviado: ON"
    );

}


// ======================================================
// DESLIGAR LED
// ======================================================

function desligarLED() {

    if (!client.connected) {
        return;
    }

    client.publish(
        TOPICO_COMANDO,
        "OFF"
    );

    console.log(
        "Comando enviado: OFF"
    );

}


// ======================================================
// MOSTRAR STATUS DO LED
// ======================================================

function mostrarLED(ligado) {

    if (ligado) {

        status.innerText =
            "LIGADO";

        status.style.color =
            "#22c55e";

        ledIndicador.className =
            "led-indicador ligado";

    }

    else {

        status.innerText =
            "DESLIGADO";

        status.style.color =
            "#ef4444";

        ledIndicador.className =
            "led-indicador desligado";

    }

}

</script>

</body>
</html>
