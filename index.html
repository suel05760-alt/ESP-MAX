    <meta charset="UTF-8">

          content="width=device-width, initial-scale=1.0">

    <!-- Biblioteca MQTT para navegador -->

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(135deg,
                #0f172a,
                #1e293b);

            color: white;

            padding: 20px;
        }

        .container {

            width: 100%;
            max-width: 500px;

            background: #111827;

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5);

            text-align: center;
        }

        .titulo {

            font-size: 32px;

            margin-bottom: 8px;
        }

        .subtitulo {

            color: #94a3b8;

            margin-bottom: 30px;
        }

        /* =========================
           CONEXÃO
        ========================= */

        .conexao {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-bottom: 30px;

            font-size: 16px;
        }

        .bolinha {

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #ef4444;

            box-shadow:

        }

        .conectado {

            background: #22c55e;

            box-shadow:

        }

        /* =========================
           LED

        .led-area {

            margin: 20px 0 35px;
        }

<body>


<div class="container">


    <h1 class="titulo">
        ESP-MAX
    </h1>


    <p class="subtitulo">
        Controle do LED GPIO 2
    </p>


    <!-- CONEXÃO -->

    <div class="conexao">

        <div id="bolinha"
             class="bolinha">
        </div>

        <span id="textoConexao">
            Desconectado
        </span>

    </div>


    <!-- LED -->

    <div class="led-area">

        <div id="led"
             class="led">
        </div>

        <div id="status"
             class="status off">

            DESLIGADO

        </div>

    </div>


    <!-- BOTÕES -->

    <div class="botoes">

        <button
            class="btn-ligar"
            onclick="ligarLED()">

            💡 LIGAR

        </button>


        <button
            class="btn-desligar"
            onclick="desligarLED()">

            🔴 DESLIGAR

        </button>

    </div>


    <!-- INFORMAÇÕES -->

    <div class="info">

        <div>
            <strong>Dispositivo:</strong>
            ESP-MAX
        </div>

        <div>
            <strong>LED:</strong>
            GPIO 2
        </div>

        <div>
            <strong>MQTT:</strong>
            HiveMQ Cloud
        </div>

        <div>
            <strong>Tópico:</strong>
            ESP-MAX/led2
        </div>

    </div>


</div>



<script>

    // =====================================================
    // CONFIGURAÇÃO HIVEMQ
    // =====================================================

    const MQTT_HOST =
        "wss://d7fd89e5e9b44d38b2a248bb67d9e159.s1.eu.hivemq.cloud:8884/mqtt";


    const MQTT_USERNAME =
        "ESP-MAX";


    const MQTT_PASSWORD =
        "21072010";


    // =====================================================
    // TÓPICOS
    // =====================================================

    const TOPICO_COMANDO =
        "ESP-MAX/led2/comando";


    const TOPICO_STATUS =
        "ESP-MAX/led2/status";


    // =====================================================
    // ELEMENTOS HTML
    // =====================================================

    const led =
        document.getElementById("led");


    const status =
        document.getElementById("status");


    const bolinha =
        document.getElementById("bolinha");


    const textoConexao =
        document.getElementById("textoConexao");


    // =====================================================
    // CLIENT MQTT
    // =====================================================

    const clientID =
        "WEB-ESP-MAX-" +
        Math.random()
        .toString(16)
        .substring(2);


    const client = mqtt.connect(
        MQTT_HOST,
        {

            clientId: clientID,

            username:
                MQTT_USERNAME,

            password:
                MQTT_PASSWORD,

            clean: true,

            reconnectPeriod: 3000,

            connectTimeout: 10000

        }
    );


    // =====================================================
    // CONECTADO
    // =====================================================

    client.on("connect", function () {

        console.log(
            "Conectado ao HiveMQ!"
        );


        bolinha.classList.add(
            "conectado"
        );


        textoConexao.textContent =
            "Conectado ao HiveMQ";


        // Assina o status do LED

        client.subscribe(
            TOPICO_STATUS,
            function (erro) {

                if (erro) {

                    console.error(
                        "Erro ao assinar tópico:",
                        erro
                    );

                }

            }
        );

    });


    // =====================================================
    // RECEBER STATUS
    // =====================================================

    client.on("message",
        function (topic, message) {

            if (topic === TOPICO_STATUS) {

                const estado =
                    message.toString()
                    .toUpperCase();


                console.log(
                    "Status recebido:",
                    estado
                );


                atualizarTela(
                    estado
                );

            }

        }
    );


    // =====================================================
    // ATUALIZAR TELA
    // =====================================================

    function atualizarTela(estado) {

        if (estado === "ON") {

            led.classList.add(
                "ligado"
            );

            status.textContent =
                "LIGADO";

            status.className =
                "status on";

        }

        else {

            led.classList.remove(
                "ligado"
            );

            status.textContent =
                "DESLIGADO";

            status.className =
                "status off";

        }

    }


    // =====================================================
    // LIGAR LED
    // =====================================================

    function ligarLED() {

        if (!client.connected) {

            alert(
                "O site não está conectado ao HiveMQ."
            );

            return;

        }


        client.publish(
            TOPICO_COMANDO,
            "ON"
        );

    }


    // =====================================================
    // DESLIGAR LED
    // =====================================================

    function desligarLED() {

        if (!client.connected) {

            alert(
                "O site não está conectado ao HiveMQ."
            );

            return;

        }


        client.publish(
            TOPICO_COMANDO,
            "OFF"
        );

    }


    // =====================================================
    // ERRO
    // =====================================================

    client.on("error", function (erro) {

        console.error(
            "Erro MQTT:",
            erro
        );

    });


    // =====================================================
    // DESCONECTADO
    // =====================================================

    client.on("close", function () {

        bolinha.classList.remove(
            "conectado"
        );


        textoConexao.textContent =
            "Desconectado — reconectando...";

    });


    // =====================================================
    // OFFLINE
    // =====================================================

    client.on("offline", function () {

        bolinha.classList.remove(
            "conectado"
        );


        textoConexao.textContent =
            "Offline";

    });

</script>


</body>

</html>
